name: Portable (Windows)

# Fork: builds a portable printcraft.exe (no installer, no signing) to test changes.
# Run from Actions → "Portable (Windows)" → Run workflow; download the artifact.
on:
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p printcraft
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/printcraft.exe dist/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE dist/
          # A test build: the updater treats it as a portable copy older than any release of this version.
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "v$ver-labs.test.$(git rev-parse --short HEAD)" | Set-Content -NoNewline dist/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: printcraft-portable-windows-x64
          path: dist/
          retention-days: 30
